name: ofertas

on:
  schedule:
    - cron: "*/5 * * * *"   # mínimo do GitHub; cada execução repete o ciclo a cada 60 s por ~4m45s
  workflow_dispatch: {}

permissions:
  contents: write           # guardar o estado das ofertas já enviadas e as mudanças do bot
  actions: write            # disparar a próxima execução (corrente sem depender do agendamento)

concurrency:
  group: ofertas
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ciclo (comandos do bot, leitura dos canais públicos, avisos)
        env:
          CANAL: telegram
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_CHATS: ${{ secrets.TG_CHATS }}
          ESTADO_FILE: estado/enviados-telegram.json
          FILA_FILE: estado/fila-whatsapp.json
        run: node ciclo.js

      # Corrente: ao terminar bem, dispara a próxima execução. O cron acima é só rede de segurança
      # (se algo falhar, o agendamento retoma). A fila de 'concurrency' evita execuções sobrepostas.
      - name: Disparar a próxima execução
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ofertas.yml --repo ${{ github.repository }}
