name: ofertas

on:
  schedule:
    - cron: "*/5 * * * *"   # rede de segurança (o GitHub atrasa/pula agendamentos); a corrente abaixo é o motor
  workflow_dispatch: {}

permissions:
  contents: write           # guardar o estado das ofertas já enviadas e as mudanças do bot
  actions: write            # criar o próximo elo da corrente

# Só uma execução por vez e UMA na fila. Quando a atual termina, a que está na fila começa.
concurrency:
  group: ofertas
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      # 1) PRIMEIRO passo, antes de qualquer outra coisa: já deixa o PRÓXIMO elo na fila.
      #    Assim a corrente não depende do fim desta execução: se ela travar, falhar ou o servidor sumir,
      #    o sucessor já existe e começa assim que esta acabar (ou for dada como perdida).
      - name: Deixar a próxima execução na fila
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do
            gh workflow run ofertas.yml --repo "$GITHUB_REPOSITORY" && exit 0
            sleep $((i * 3))
          done
          echo "::warning::não consegui enfileirar a próxima execução"

      # ref: main = a versão MAIS NOVA no momento em que a execução começa (e não a de quando entrou na fila)
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ciclo (comandos do bot, leitura dos canais públicos, avisos)
        env:
          CANAL: telegram
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_CHATS: ${{ secrets.TG_CHATS }}
          ESTADO_FILE: estado/enviados-telegram.json
          FILA_FILE: estado/fila-whatsapp.json
        run: node ciclo.js
